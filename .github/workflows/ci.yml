name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle-windows:
    name: Lifecycle (${{ matrix.shell }}, Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell
            node: '24'
          - shell: pwsh
            node: '22.7.0'
          - shell: pwsh
            node: '24'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - name: Parse and run isolated lifecycle tests
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $owned = @(
            Get-ChildItem -LiteralPath . -File -Filter '*.ps1'
            Get-ChildItem -LiteralPath openai -Recurse -File -Filter '*.ps1'
            Get-ChildItem -LiteralPath stack -Recurse -File -Filter '*.ps1'
          )
          foreach ($file in $owned) {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors) { throw "PowerShell parse failure in $($file.FullName): $errors" }
          }
          $tests = @()
          if (Test-Path -LiteralPath 'stack/tests') {
            $tests += @(Get-ChildItem -LiteralPath 'stack/tests' -File -Filter 'test-*.ps1' | ForEach-Object FullName)
          }
          if (Test-Path -LiteralPath 'tests/claude-windows') {
            $tests += @(Get-ChildItem -LiteralPath 'tests/claude-windows' -File -Filter 'test-*.ps1' |
              Where-Object Name -ne 'test-cross-engine.ps1' | ForEach-Object FullName)
          }
          $testHost = (Get-Process -Id $PID).Path
          foreach ($test in $tests) {
            $testArgs = @('-NoProfile')
            if ($PSVersionTable.PSEdition -ne 'Core') { $testArgs += @('-ExecutionPolicy','Bypass') }
            $testArgs += @('-File',$test)
            & $testHost @testArgs
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit $LASTEXITCODE" }
          }
          if ($PSVersionTable.PSEdition -eq 'Core') {
            & ./tests/claude-windows/test-cross-engine.ps1 `
              -EngineA "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" `
              -EngineB (Get-Command pwsh).Source
            foreach ($nodeTest in (Get-ChildItem -LiteralPath 'tests/claude-windows' -File -Filter 'test-*.js')) {
              & node $nodeTest.FullName
              if ($LASTEXITCODE -ne 0) { throw "$($nodeTest.FullName) failed with exit $LASTEXITCODE" }
            }
          }
      - name: Release policy
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tools/test-release-policy.ps1

  lifecycle-unix:
    name: Unix lifecycle (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.7.0', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - name: Parse shell and Node entry points
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh uninstall.sh stack/bin/pxpipe-ctl.sh stack/bin/lib/token-stack-supervisor.sh
          node --check stack/bin/lib/monitor.js
          node --check stack/bin/lib/unix-lifecycle.js
          node --check stack/bin/lib/unix-process.js
      - name: Run isolated Unix tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(stack/tests/test-*.sh)
          ((${#tests[@]} > 0)) || { echo 'No Unix lifecycle tests found' >&2; exit 1; }
          for test_file in "${tests[@]}"; do bash "$test_file"; done

  native-context-compiler:
    name: Native Context Compiler (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.7.0', '24']
    defaults:
      run:
        working-directory: openai/native-context-compiler
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: openai/native-context-compiler/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run benchmark
      - run: npm pack --dry-run

  provenance:
    name: Vendored source provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Compare unpatched files with immutable upstream commits
        shell: pwsh
        run: ./tools/verify-vendored-sources.ps1

  pxpipe:
    name: pxpipe (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.7.0', '24']
    defaults:
      run:
        working-directory: upstream/pxpipe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: upstream/pxpipe/pnpm-lock.yaml
      - name: Activate the declared package manager
        run: corepack enable && corepack prepare pnpm@10.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm audit --prod --audit-level high

  rtk:
    name: RTK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: upstream/rtk
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.91.0
      - name: Add Git Unix tools for Windows-only cross-platform tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\Program Files\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: cargo test --locked
      - name: RustSec audit
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit --deny warnings

  reproducible-release:
    name: Reproducible release
    runs-on: windows-latest
    needs: [lifecycle-windows, lifecycle-unix, native-context-compiler, provenance, pxpipe, rtk]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build twice and compare
        shell: pwsh
        run: |
          ./tools/build-release.ps1 -OutputDirectory "$env:RUNNER_TEMP\release-a"
          ./tools/build-release.ps1 -OutputDirectory "$env:RUNNER_TEMP\release-b"
          $a = Get-ChildItem "$env:RUNNER_TEMP\release-a" -File | Sort-Object Name
          $b = Get-ChildItem "$env:RUNNER_TEMP\release-b" -File | Sort-Object Name
          if ((@($a.Name) -join "`n") -cne (@($b.Name) -join "`n")) { throw 'Release file sets differ.' }
          foreach ($file in $a) {
            $other = Join-Path "$env:RUNNER_TEMP\release-b" $file.Name
            if ((Get-FileHash $file.FullName).Hash -cne (Get-FileHash $other).Hash) { throw "$($file.Name) is not reproducible." }
          }
      - name: Validate archive paths and notices
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($zipPath in Get-ChildItem "$env:RUNNER_TEMP\release-a" -Filter '*.zip') {
            $zip = [IO.Compression.ZipFile]::OpenRead($zipPath.FullName)
            try {
              foreach ($entry in $zip.Entries) {
                if ($entry.FullName -match '(^|/)\.\.(/|$)' -or $entry.FullName.StartsWith('/') -or $entry.FullName.Contains('\')) { throw "Unsafe archive entry: $($entry.FullName)" }
              }
              foreach ($required in @('claude-chatgpt-token-stack-0.3.0/LICENSE','claude-chatgpt-token-stack-0.3.0/openai/native-context-compiler/package.json')) {
                if (-not @($zip.Entries | Where-Object FullName -CEQ $required)) { throw "Project archive is missing $required" }
              }
            } finally { $zip.Dispose() }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-chatgpt-token-stack-${{ github.sha }}
          path: ${{ runner.temp }}/release-a/*
          if-no-files-found: error
          retention-days: 14
